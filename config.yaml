# PA vs CXPA Classification — Configuration
# All hyperparameters in one place for reproducibility

seed: 42

# --- Data paths ---
data:
  benign_dir: Bening
  malign_dir: Malign
  output_dir: outputs
  pretrained_dir: pretrained

# --- Preprocessing ---
preprocessing:
  patch_size: 256
  target_mpp: 0.5          # ~20x magnification (microns per pixel)
  tissue_threshold: 0.5     # min fraction of tissue in a patch to keep it
  saturation_threshold: 15   # HSV saturation threshold for tissue detection
  thumbnail_downsample: 64   # tissue mask computed on a thumbnail 64x smaller than level 0

# --- Feature extraction ---
feature_extraction:
  batch_size: 64
  num_workers: 4
  extractors:
    - ctranspath
    - resnet50
    - uni

# --- Macenko stain normalisation ---
# target: highest mean HSV saturation among reference_candidates random patches of the first benign slide
stain_normalization:
  reference_seed: 0
  reference_candidates: 40

# --- MIL aggregators and patch MLP ---
model:
  hidden_dim: 512
  attention_dim: 256
  dropout: 0.25
  k_sample: 8                # CLAM-SB: top-k / bottom-k patches for the instance loss
  instance_loss_weight: 0.3  # CLAM-SB

# --- Training ---
# Fixed epoch budget shared by MIL and the patch baseline; LOPOCV leaves no
# validation patient for early stopping.
training:
  lr: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 50

# --- Class imbalance strategies ---
# oversample + smote is omitted: SMOTE already balances the classes, so
# oversampling after it changes nothing.
imbalance:
  strategies:
    - none
    - oversample
    - smote
  smote_k_neighbors: 3

# --- Evaluation ---
evaluation:
  n_bootstrap: 1000
  confidence_level: 0.95
